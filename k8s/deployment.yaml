apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-devops-app
  template:
    metadata:
      labels:
        app: kube-devops-app
    spec:
      containers:
      - name: kube-devops-app
        image: arbin09/kube-devops-app:latest
        ports:
        - containerPort: 80
        env:
        - name: APP_ENV
          value: "production"
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: kube-devops-app-service
spec:
  type: NodePort
  selector:
    app: kube-devops-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30095